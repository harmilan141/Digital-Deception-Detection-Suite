<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 230px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #fafafa;
    }
    .header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .header img { width:28px; height:28px; }
    .header h1 { font-size:14px; margin:0; color:#1a1a1a; }
    .row { display:flex; align-items:center; justify-content:space-between; }
    .status { font-size:13px; color:#555; }
    .switch { position:relative; display:inline-block; width:42px; height:24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:24px; transition:.2s; }
    .slider:before { position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.2s; }
    input:checked + .slider { background:#7c3aed; }
    input:checked + .slider:before { transform:translateX(18px); }
    .info { margin-top:12px; padding-top:10px; border-top:1px solid #e5e5e5; }
    .info p { font-size:11px; color:#888; margin:0 0 4px; line-height:1.4; }
    .footer { margin-top:10px; padding-top:10px; border-top:1px solid #e5e5e5; }
    .debug-link {
      display:block; text-align:center; font-size:12px; padding:6px 10px;
      border:1px solid #ddd; border-radius:6px; background:white;
      color:#5b21b6; text-decoration:none; font-weight:500;
    }
    .debug-link:hover { background:#f5f3ff; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="DDD">
    <h1>Deception Detector</h1>
  </div>
  <div class="row">
    <span class="status" id="status">Enabled</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="info">
    <p>🤖 ML classification runs entirely in your browser.</p>
  </div>
  <div class="footer">
    <a class="debug-link" href="debug.html" target="_blank">View captured messages</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
